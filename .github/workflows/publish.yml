# Publishes n8n-nodes-opentodo to npm with a provenance statement when a
# version tag is pushed. n8n requires verified community nodes to be published
# from GitHub Actions with npm provenance (since 1 May 2026).
#
# One-time setup: an npm automation token with publish rights for this package,
# stored as the repository secret NPM_TOKEN (Settings → Secrets and variables →
# Actions). npm Trusted Publishing (OIDC) works too: configure this repository
# and workflow as a trusted publisher on npmjs.com and leave NPM_TOKEN unset.
#
# Release: set "version" in package.json and a CHANGELOG entry, merge to main,
# then push a tag with the same version, with or without a leading "v":
#
#   git tag 0.1.0 && git push origin 0.1.0
#
# `npm run release` (n8n-node release) does the bump, changelog, commit and tag
# interactively and leaves the publishing to this workflow.

name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to mint the OIDC token that signs the provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish with provenance
        # RELEASE_MODE lets the package's prepublishOnly guard (n8n-node prerelease) through.
        run: npm publish --provenance --access public
        env:
          RELEASE_MODE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
