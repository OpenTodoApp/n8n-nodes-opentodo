# Publishes n8n-nodes-opentodo to npm with a provenance statement when a
# version tag is pushed. n8n requires verified community nodes to be published
# from GitHub Actions with npm provenance (since 1 May 2026).
#
# One-time setup: npm Trusted Publishing (OIDC), no stored token. On npmjs.com
# (package → Settings → Trusted Publisher → GitHub Actions) name this
# organisation, repository, the workflow `publish.yml` and the environment `npm`;
# here, protect the `npm` environment (Settings → Environments) with a required
# reviewer and two tag rules, `[0-9]*` and `v*` (both tag forms below). While the
# repository secret NPM_TOKEN still exists it is passed as a fallback; delete it
# once a release has published through trusted publishing.
#
# Release: set "version" in package.json and a CHANGELOG entry, merge to main,
# then push a tag with the same version, with or without a leading "v":
#
#   git tag 0.1.0 && git push origin 0.1.0
#
# `npm run release` (n8n-node release) does the bump, changelog, commit and tag
# interactively and leaves the publishing to this workflow.

name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # The trusted publisher on npmjs.com names this environment, and its reviewer approves each publish.
    environment: npm
    permissions:
      contents: read
      # Required to mint the OIDC token that signs the provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or later; Node 24 may ship an older npm.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish with provenance
        # RELEASE_MODE lets the package's prepublishOnly guard (n8n-node prerelease) through.
        run: npm publish --provenance --access public
        env:
          RELEASE_MODE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
